services:
  - type: web
    name: controle-estoque
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn controle_estoque.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: controle-estoque-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "4"

databases:
  - name: controle-estoque-db
    databaseName: controle_estoque
    user: controle_estoque
